[project]
name = "asopa"
version = "0.1.0"
description = "ASOPA — Attention-Based SIC Ordering and Power Allocation for NOMA networks"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
  { name = "Liang Huang" },
  { name = "Bincheng Zhu" },
  { name = "Runkai Nan" },
  { name = "Kaikai Chi" },
  { name = "Yuan Wu" },
]
dependencies = [
  "numpy>=1.21.0,<2.0.0",
  "scipy>=1.7.0",
  "matplotlib>=3.5.0",
  "cvxopt>=1.3.0",
  "tqdm>=4.60.0",
  "six>=1.16.0",
  "pillow>=8.0.0",
  "tensorboard>=2.8.0,<3.0.0",
  "protobuf>=3.19.0,<4.0.0",
]

[project.optional-dependencies]
cpu = [
  "torch>=2.3.1,<2.4",
  "torchvision>=0.18.1,<0.19",
  "torchaudio>=2.3.1,<2.4",
]
cu121 = [
  "torch>=2.3.1,<2.4",
  "torchvision>=0.18.1,<0.19",
  "torchaudio>=2.3.1,<2.4",
]

[dependency-groups]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "black==25.9.0",
  "pre-commit==4.3.0",
]

[tool.uv]
package = false
conflicts = [
  [{ extra = "cpu" }, { extra = "cu121" }],
]

[tool.uv.sources]
torch       = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu121", extra = "cu121" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu121", extra = "cu121" }]
torchaudio  = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu121", extra = "cu121" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: tests requiring GPU (skipped by default; run with `uv run pytest -m gpu`)",
  "slow: tests that take >5s (skipped by default; run with `uv run pytest -m slow`)",
]
addopts = "-m 'not gpu and not slow'"

[tool.black]
line-length = 88
target-version = ["py310"]


